name: Build and Release

# Two ways in:
#   1. workflow_dispatch — you type the version; the job tests main and ONLY
#      creates the tag + release if tests pass (no dangling tags on failure).
#   2. push of a v* tag — the original manual-tag path, still supported.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.0 (must match build.gradle.kts). Tag is created only if tests pass.'
        required: true
        type: string

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # JavaFX needs a display + GTK/GL libs even for unit tests that construct
      # controls. xvfb provides a virtual framebuffer so the real toolkit starts
      # headlessly (preferred over Monocle, which has no JavaFX 25-matched build).
      - name: Install headless display deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgtk-3-0

      # Resolve the release tag from either the dispatch input or the pushed tag,
      # normalizing so "0.9.0" and "v0.9.0" both yield tag "v0.9.0".
      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VER="${RAW#v}"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}"  >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v${VER}"

      # Guard 1: the version being released must match build.gradle.kts, so the
      # built JAR, the tag, and the catalog entry can never disagree.
      - name: Verify version matches build.gradle.kts
        run: |
          FILE_VER=$(grep -E '^[[:space:]]*version = "' build.gradle.kts | head -1 | sed -E 's/.*version = "([^"]+)".*/\1/')
          if [ "$FILE_VER" != "${{ steps.rel.outputs.ver }}" ]; then
            echo "::error::Release version ${{ steps.rel.outputs.ver }} != build.gradle.kts version ${FILE_VER}. Bump build.gradle.kts and push to main first." >&2
            exit 1
          fi
          echo "Version match: ${FILE_VER}"

      # Guard 2 (dispatch only): refuse to clobber an existing tag.
      - name: Ensure tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.rel.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.rel.outputs.tag }} already exists. Bump the version." >&2
            exit 1
          fi

      # The gate: if tests fail, the job stops here and no tag is ever created.
      # `build` does NOT run shadowJar (it is not wired into the build graph), so it
      # only produces the thin jar. FlowPath now bundles SMILE for the UMAP engine, so
      # the thin jar would install and then fail at runtime with NoClassDefFoundError
      # the moment a user pressed Run UMAP. The release ships build/libs/*-all.jar,
      # which means shadowJar MUST be invoked explicitly here.
      - name: Build and test
        env:
          FLOWPATH_FX_REQUIRED: "true"   # fail loudly if the xvfb display breaks
        run: xvfb-run --auto-servernum ./gradlew build shadowJar

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      # Tests passed (the step above would have failed the job otherwise). Create
      # the tag now. Pushed with GITHUB_TOKEN, so it will NOT re-trigger this
      # workflow (recursion prevention) — exactly what we want.
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.rel.outputs.tag }}" -m "FlowPath ${{ steps.rel.outputs.tag }}"
          git push origin "${{ steps.rel.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: build/libs/*-all.jar
          generate_release_notes: true

      # The catalog now lives in this repo, so updating it is a local edit and a
      # push — no cross-repo clone, and no CATALOG_PAT. That token was a recurring
      # failure mode: a read-only or expired PAT failed here with a 403 *after* the
      # tag and release had already been created, leaving a published release that
      # QuPath could not see. GITHUB_TOKEN can write to its own repo, so that whole
      # class of failure is gone.
      - name: Update catalog
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          JAR_NAME=$(find build/libs -name '*-all.jar' -printf '%f' -quit)
          # GitHub normalizes spaces to dots in release asset filenames
          JAR_NAME="${JAR_NAME// /.}"

          EXTENSION_NAME="FlowPath"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${JAR_NAME}"

          NEW_RELEASE=$(jq -n --arg name "$TAG" --arg url "$DOWNLOAD_URL" \
            '{name: $name, main_url: $url, version_range: {min: "v0.7.0"}}')

          # Idempotent insert: skip if this version is already present (prevents duplicates)
          jq --arg ext "$EXTENSION_NAME" --argjson release "$NEW_RELEASE" \
            '(.extensions[] | select(.name == $ext) | .releases) |= (if any(.[]; .name == $release.name) then . else [$release] + . end)' \
            catalog.json > catalog.tmp && mv catalog.tmp catalog.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # On the tag-push path the checkout is detached at the tag, and on the
          # dispatch path main may have moved since the job started. Either way,
          # commit onto current origin/main rather than onto whatever this
          # workspace happens to be sitting on — the catalog edit is independent
          # of the tagged tree, so replaying it on the newest main is correct and
          # avoids a non-fast-forward push.
          git stash push -- catalog.json
          git fetch origin main
          git checkout -B main origin/main
          git stash pop

          git add catalog.json
          git diff --staged --quiet && { echo "Catalog already contains ${EXTENSION_NAME} ${TAG} - nothing to commit."; exit 0; }
          git commit -m ":bookmark: Add ${EXTENSION_NAME} ${TAG} to catalog"
          # The tag was cut before this commit, so the release JAR and the catalog
          # entry pointing at it are deliberately one commit apart on main.
          git push origin HEAD:main
