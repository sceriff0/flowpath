name: CI

on:
  push:
    # dev is tested exactly as main is. With triggers on main alone, work on dev
    # reached CI only at merge time -- which is the moment an integration branch
    # exists to happen *before*.
    branches: [ main, dev ]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main, dev ]

# A second push to the same branch supersedes the first: an in-flight run of an
# older commit tells you nothing you still need, and the xvfb suite is the long
# pole here. Never cancels on main, where every commit's result is a record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # JavaFX needs a display + GTK/GL libs even for unit tests that construct
      # controls. xvfb provides a virtual framebuffer so the real toolkit starts
      # headlessly (preferred over Monocle, which has no JavaFX 25-matched build).
      - name: Install headless display deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgtk-3-0

      - name: Build and test
        env:
          FLOWPATH_FX_REQUIRED: "true"   # fail loudly if the xvfb display breaks
        run: xvfb-run --auto-servernum ./gradlew build

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
